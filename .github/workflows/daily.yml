name: Daily Agent Digest

# Digest only. Do not call WeChat draft APIs here:
# the IP whitelist is a fixed machine, not Actions egress.
# Local: wechat/README.md → write_from_digest.py → review → push_draft.py

on:
  schedule:
    # GitHub schedule is best-effort (UTC). This repo's 23:00/23:30 ticks
    # were created 1.5–2.1h late every day in 2026-09-07..17, then Horizon
    # ran 20–50m and Pages built ~1m. A 07:10 Asia/Shanghai watcher therefore
    # saw 404 even though the later run and pages-build-deployment went green.
    # Digest commits land on gh-pages, so main can look idle; GitHub may also
    # delay or drop :00/:30 crons under load.
    # Shift earlier and stagger off-minute retries. After the first live
    # summary-zh, later ticks skip Horizon (see scripts/digest_publish_gate.py).
    # Target: page up ~07:30 Asia/Shanghai when delay stays near 2h.
    # Honest SLA: 07:10 can still 404 if GitHub delay > ~2.5h or Horizon > ~50m.
    - cron: "13 20 * * *"   # 04:13 Asia/Shanghai — primary
    - cron: "17 21 * * *"   # 05:17 Asia/Shanghai — retry
    - cron: "23 22 * * *"   # 06:23 Asia/Shanghai — retry
    - cron: "37 23 * * *"   # 07:37 Asia/Shanghai — last same-morning chance
  workflow_dispatch:
    inputs:
      hours:
        description: Lookback window in hours
        required: false
        default: "24"
      force:
        description: Rebuild even if today's summary-zh is already on Pages
        type: boolean
        default: false

# A late retry waits instead of starting a second Horizon run.
# After the first success, the next run's gate job exits in seconds.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v5

      - name: Check live summary-zh
        id: check
        env:
          DIGEST_EVENT_NAME: ${{ github.event_name }}
          DIGEST_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python3 scripts/digest_publish_gate.py

  daily-summary:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v5
        with:
          path: overlay

      - name: Checkout Horizon engine
        uses: actions/checkout@v5
        with:
          repository: Thysrael/Horizon
          path: horizon

      - name: Overlay config and profiles
        run: |
          cp overlay/data/config.github.json horizon/data/config.json
          rm -rf horizon/profiles/agent-engineer horizon/profiles/harness-arch horizon/profiles/ai-daily horizon/profiles/ai-deals
          cp -R overlay/profiles/agent-engineer horizon/profiles/agent-engineer
          cp -R overlay/profiles/harness-arch horizon/profiles/harness-arch
          cp -R overlay/profiles/ai-daily horizon/profiles/ai-daily
          cp -R overlay/profiles/ai-deals horizon/profiles/ai-deals
          cat overlay/profiles/STYLE.md >> horizon/profiles/agent-engineer/enrichment.md
          cat overlay/profiles/STYLE.md >> horizon/profiles/harness-arch/enrichment.md
          cat overlay/profiles/STYLE.md >> horizon/profiles/ai-daily/enrichment.md
          cat overlay/profiles/STYLE.md >> horizon/profiles/ai-deals/enrichment.md
          cp overlay/data/source_tiers.json horizon/data/source_tiers.json
          cp overlay/scripts/apply_source_tiers.py horizon/src/apply_source_tiers.py
          # Actions uses gpt-5.5 on the NewAPI OpenAI-compatible gateway (ooioo.work).
          # grok_reasoning_effort.py is local-only (config.json still grok-4.6).
          python3 overlay/patches/shanghai_digest_date.py horizon/src/orchestrator.py
          python3 overlay/patches/apply_source_tiers.py horizon/src/orchestrator.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install Horizon
        working-directory: horizon
        run: uv sync

      - name: Scrape sites without official RSS
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p scraped-feeds
          python3 overlay/scripts/scrape_no_rss.py --out scraped-feeds --print-items
          python3 -m http.server 8766 --directory scraped-feeds --bind 127.0.0.1 &
          echo $! > /tmp/scraped-feeds.pid
          sleep 1
          curl -sf http://127.0.0.1:8766/cursor-changelog.xml >/dev/null
          curl -sf http://127.0.0.1:8766/cognition-blog.xml >/dev/null
          curl -sf http://127.0.0.1:8766/github-trending.xml >/dev/null
          curl -sf http://127.0.0.1:8766/hf-daily-papers.xml >/dev/null
          curl -sf http://127.0.0.1:8766/hf-trending-models.xml >/dev/null
          curl -sf http://127.0.0.1:8766/x-hot.xml >/dev/null
          curl -sf http://127.0.0.1:8766/lobsters.xml >/dev/null

      - name: Run Horizon
        working-directory: horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run horizon --hours ${{ github.event.inputs.hours || '24' }} 2>&1 | tee "$GITHUB_WORKSPACE/horizon-run.log"

      - name: Patch Pages baseurl and homepage
        run: |
          cp overlay/pages/_config.yml horizon/docs/_config.yml
          cp overlay/pages/index.md horizon/docs/index.md
          mkdir -p horizon/docs/assets/css horizon/docs/assets/js horizon/docs/_includes
          cp overlay/pages/assets/css/horizon.css horizon/docs/assets/css/horizon.css
          cp overlay/pages/_includes/head-custom.html horizon/docs/_includes/head-custom.html
          cp overlay/pages/assets/js/theme.js horizon/docs/assets/js/theme.js

      - name: Set current date
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Note today's Chinese digest for local WeChat writing
        run: |
          ZH="_posts/${DATE}-summary-zh.md"
          {
            echo "# 今日公众号原料"
            echo
            echo "GitHub Actions 只出日报，不推微信草稿箱。"
            echo
            echo "- 中文日报：\`${ZH}\`"
            echo "- 写法：[wechat/STYLE.md](https://github.com/Q-xuan/agent-horizon/blob/main/wechat/STYLE.md)"
            echo "- 本地成稿：\`python3 wechat/scripts/write_from_digest.py --digest <日报.md>\`"
            echo "- 先看成稿。再在固定 IP 机器上：\`python3 wechat/scripts/push_draft.py wechat/posts/YYYY-MM-DD.md --cover wechat/cover.png\`"
          } > horizon/docs/wechat-latest.md
          if [ -f "horizon/${ZH}" ] || [ -f "horizon/docs/${ZH}" ]; then
            echo "Noted ${ZH}"
          else
            echo "Digest file not in the usual place yet; still wrote wechat-latest.md"
          fi

      - name: Fail if Digest AI is dead or empty
        run: |
          python3 overlay/scripts/check_digest_health.py \
            --log "$GITHUB_WORKSPACE/horizon-run.log" \
            --zh "horizon/docs/_posts/${DATE}-summary-zh.md"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./horizon/docs
          keep_files: true
          commit_message: "Daily digest ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
