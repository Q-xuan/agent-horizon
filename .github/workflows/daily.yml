name: Daily Agent Digest

on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Shanghai
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: Lookback window in hours
        required: false
        default: "24"

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v5
        with:
          path: overlay

      - name: Checkout Horizon engine
        uses: actions/checkout@v5
        with:
          repository: Thysrael/Horizon
          path: horizon

      - name: Overlay config and profiles
        run: |
          cp overlay/data/config.github.json horizon/data/config.json
          rm -rf horizon/profiles/agent-engineer horizon/profiles/harness-arch
          cp -R overlay/profiles/agent-engineer horizon/profiles/agent-engineer
          cp -R overlay/profiles/harness-arch horizon/profiles/harness-arch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install Horizon
        working-directory: horizon
        run: uv sync

      - name: Run Horizon
        working-directory: horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours ${{ github.event.inputs.hours || '24' }}

      - name: Set current date
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./horizon/docs
          keep_files: true
          commit_message: "Daily digest ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
